<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f2444"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>WSET Level 2 Trainer</title><style>
:root{--ink:#251d22;--muted:#766c73;--paper:#fbf8f5;--card:#fff;--wine:#6f2444;--border:#e4dadf;--good:#e7f5ea;--bad:#fde9e9}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink)}main{max-width:760px;margin:auto;padding:20px 16px 48px}.hero{padding:16px 0 8px}.eyebrow{color:var(--wine);font-weight:800;letter-spacing:.08em;font-size:.78rem}h1{font-size:2rem;margin:.25rem 0 .5rem}h2{line-height:1.25}.sub,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.review{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px}.review{margin-bottom:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center}.stat b{font-size:1.45rem;display:block}.section{margin-top:22px}.btn,.answer{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--border);background:#fff;padding:14px;text-align:left;color:var(--ink);font:inherit}.btn strong{display:block}.btn span{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}.primary{background:var(--wine);color:white;border-color:var(--wine);text-align:center;font-weight:800}.answer{margin:6px 0}.correct{background:var(--good);border-color:#75ae83}.wrong{background:var(--bad);border-color:#d88}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.progress{height:8px;background:#eadfe4;border-radius:99px;overflow:hidden;margin:10px 0 22px}.progress>div{height:100%;background:var(--wine);width:0}.feedback{margin-top:14px;padding:14px;border-radius:14px;background:#f4eef1}.feedback div{margin-top:5px}@media(max-width:430px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}h1{font-size:1.7rem}}
</style></head><body><main>
<section id="home"><div class="hero"><div class="eyebrow">WSET LEVEL 2</div><h1>Wine Exam Trainer</h1><div class="sub">1,000-question adaptive bank. Correctly answered questions fade back; missed questions return more often.</div></div><div class="stats section"><div class="card stat"><b id="seen">0</b><span class="muted">Seen</span></div><div class="card stat"><b id="wrongTotal">0</b><span class="muted">Misses</span></div><div class="card stat"><b id="accuracy">—</b><span class="muted">Accuracy</span></div></div><div class="section"><button class="btn primary" data-start="mock">Start 50-question WSET-style mock exam</button></div><div class="section"><h2>Adaptive practice</h2><div class="grid"><button class="btn" data-start="adaptive" data-topic="all" data-count="10"><strong>Rapid 10</strong><span>Across the syllabus</span></button><button class="btn" data-start="adaptive" data-topic="principal" data-count="20"><strong>Principal grapes</strong><span>Big 8 • highest exam weight</span></button><button class="btn" data-start="adaptive" data-topic="regional" data-count="20"><strong>Regional grapes</strong><span>Regions & classic varieties</span></button><button class="btn" data-start="adaptive" data-topic="vineyard" data-count="15"><strong>Vineyard & climate</strong><span>Growing, ripening, labels</span></button><button class="btn" data-start="adaptive" data-topic="winemaking" data-count="15"><strong>Winemaking</strong><span>Fermentation, oak, lees, MLC</span></button><button class="btn" data-start="adaptive" data-topic="sparkling" data-count="15"><strong>Sparkling & fortified</strong><span>Champagne, Prosecco, Sherry, Port</span></button><button class="btn" data-start="adaptive" data-topic="service" data-count="15"><strong>Service & food</strong><span>Faults, storage, pairing</span></button></div></div></section>
<section id="quiz" hidden><div class="row"><button id="quit" class="btn" style="width:auto">← Exit</button><span id="progress" class="muted"></span></div><div class="progress"><div id="bar"></div></div><div class="eyebrow" id="qtopic"></div><h2 id="qtext"></h2><div id="answers"></div><div id="feedback" class="feedback" hidden></div><button id="next" class="btn primary" hidden style="margin-top:14px">Next question</button></section>
<section id="results" hidden><div class="hero" style="text-align:center"><div class="eyebrow">QUIZ COMPLETE</div><h1 id="score">0%</h1><div id="grade" class="sub"></div></div><div id="review" class="section"></div><button id="homeBtn" class="btn primary section">Back to practice menu</button></section>
